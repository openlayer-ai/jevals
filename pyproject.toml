[project]
name = "jevals"
version = "0.1.4"
description = "Agent evals and guardrails that run in one request, built on System One models (Jev, Kev, Laya)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["evals", "llm", "agents", "guardrails", "jev", "typesafe", "system-one"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.5",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
pii = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2"]
mcp = ["mcp>=1.2"]
openai-agents = ["openai-agents>=0.1"]
langgraph = ["langgraph>=0.2", "langchain-core>=0.3"]
claude = ["claude-agent-sdk>=0.1"]
laya = ["laya-mlx>=0.1; python_version >= '3.11'"]
pandas = ["pandas>=2.0"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.10",
  "respx>=0.21",
]

[project.urls]
Homepage = "https://github.com/openlayer-ai/jevals"
Repository = "https://github.com/openlayer-ai/jevals"

[project.scripts]
jevals = "jevals.cli:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jevals"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "SIM108", "B905", "UP007"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
