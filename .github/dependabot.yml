version: 2
updates:
  # Actions are pinned to commit SHAs. Dependabot bumps the SHA and the
  # version comment together, once a week, in one grouped PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns:
          - "*"
